#zx-directions .zx-window { --zx-bg:#0d111b; --zx-surface:#151b28; --zx-raised:#1b2332; --zx-line:#303a4d; --zx-text:#f0f3fa; --zx-muted:#a3afc2; --zx-accent:#91ecda; --zx-on-accent:#10221f; --zx-selected:#202f40; --zx-good:#9bdcba; --zx-error:#ffb69e; --zx-error-bg:#32251f; color-scheme:dark; color:var(--zx-text); background:var(--zx-bg); font:14px/1.5 'Microsoft YaHei UI','Segoe UI',sans-serif; width:100%; min-height:830px; position:relative; overflow:clip; }
#zx-directions .zx-window *, #zx-directions .zx-window *::before, #zx-directions .zx-window *::after { box-sizing:border-box; }
#zx-directions .zx-window button, #zx-directions .zx-window input, #zx-directions .zx-window select, #zx-directions .zx-window textarea { font:inherit; color:inherit; }
#zx-directions .zx-window button { transition:background .16s ease,border-color .16s ease,transform .12s ease; }
#zx-directions .zx-window button:active { transform:translateY(1px); }
#zx-directions .zx-window button:disabled { opacity:.45; cursor:not-allowed; }
#zx-directions .zx-window button:focus-visible, #zx-directions .zx-window input:focus-visible, #zx-directions .zx-window select:focus-visible, #zx-directions .zx-window textarea:focus-visible { outline:2px solid var(--zx-accent); outline-offset:3px; }
#zx-directions .zx-window h2, #zx-directions .zx-window h3, #zx-directions .zx-window p { margin:0; }
#zx-directions .zx-window h2 { font-size:34px; font-weight:600; letter-spacing:-1.3px; line-height:1.2; }
#zx-directions .zx-window h3 { font-size:15px; font-weight:600; }
#zx-directions .zx-mono { font-family:'Cascadia Code',Consolas,'Microsoft YaHei UI',monospace; font-variant-numeric:tabular-nums; }
#zx-directions .zx-muted { color:var(--zx-muted); }
#zx-directions .zx-kicker { color:var(--zx-muted); font:11px/1.5 'Cascadia Code',Consolas,monospace; letter-spacing:2px; text-transform:uppercase; }
#zx-directions .zx-icon { width:16px; height:16px; flex:none; }
#zx-directions .zx-top { height:44px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 22px; border-bottom:1px solid var(--zx-line); position:relative; z-index:1; }
#zx-directions .zx-brand { font:600 16px/1 'Segoe UI',sans-serif; display:flex; align-items:center; gap:10px; letter-spacing:-.3px; }
#zx-directions .zx-brand-mark { color:var(--zx-accent); font:700 24px/1 'Segoe UI',sans-serif; transform:skew(-12deg); }
#zx-directions .zx-preview-tag { color:var(--zx-muted); font-size:11px; }
#zx-directions .zx-chrome { display:flex; gap:25px; align-items:center; opacity:.7; font:16px/1 'Segoe UI',sans-serif; }
#zx-directions .zx-button { border:1px solid var(--zx-line); background:var(--zx-surface); border-radius:8px; padding:8px 13px; min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap; }
#zx-directions .zx-button:hover { background:var(--zx-raised); border-color:var(--zx-muted); }
#zx-directions .zx-button.primary { background:var(--zx-accent); border-color:var(--zx-accent); color:var(--zx-on-accent); font-weight:600; }
#zx-directions .zx-button.primary:hover { filter:brightness(1.08); }
#zx-directions .zx-button.quiet { background:transparent; border-color:transparent; color:var(--zx-muted); }
#zx-directions .zx-button.quiet:hover { background:var(--zx-raised); color:var(--zx-text); }
#zx-directions .zx-button.danger { color:var(--zx-error); }
#zx-directions .zx-controls { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
#zx-directions .zx-mode { display:flex; gap:4px; flex-wrap:wrap; }
#zx-directions .zx-mode button { display:inline-flex; align-items:center; gap:8px; background:transparent; color:var(--zx-muted); border:0; border-radius:7px; padding:8px 12px; min-height:36px; }
#zx-directions .zx-mode button[aria-pressed=true] { background:var(--zx-selected); color:var(--zx-accent); }
#zx-directions .zx-mode button:hover { background:var(--zx-raised); }
#zx-directions .zx-path { display:flex; align-items:center; min-width:0; gap:8px; color:var(--zx-muted); font-size:12px; margin-top:12px; }
#zx-directions .zx-path span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#zx-directions .zx-params { display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; padding:14px 0; border-bottom:1px solid var(--zx-line); }
#zx-directions .zx-param { display:flex; align-items:center; gap:8px; font-size:12px; }
#zx-directions .zx-param .zx-button { min-height:30px; padding:4px 7px; font-size:12px; }
#zx-directions .zx-param label, #zx-directions .zx-param > span { color:var(--zx-muted); }
#zx-directions .zx-param input { accent-color:var(--zx-accent); }
#zx-directions .zx-flex-spacer { flex:1; }
#zx-directions .zx-listbar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 0 12px; }
#zx-directions .zx-filters { display:flex; flex-wrap:wrap; gap:4px; }
#zx-directions .zx-filter { background:transparent; border:0; border-radius:6px; padding:6px 9px; color:var(--zx-muted); min-height:32px; font-size:12px; }
#zx-directions .zx-filter b { font-weight:500; margin-left:5px; font-variant-numeric:tabular-nums; }
#zx-directions .zx-filter[aria-pressed=true] { background:var(--zx-selected); color:var(--zx-accent); }
#zx-directions .zx-filter:hover { background:var(--zx-raised); }
#zx-directions .zx-search { display:flex; align-items:center; gap:7px; color:var(--zx-muted); background:var(--zx-surface); border:1px solid var(--zx-line); border-radius:7px; padding:0 9px; width:190px; flex:none; }
#zx-directions .zx-search input { width:100%; min-width:0; background:transparent; border:0; padding:7px 0; min-height:34px; font-size:12px; }
#zx-directions .zx-search input::placeholder { color:var(--zx-muted); opacity:1; }
#zx-directions .zx-search:focus-within { border-color:var(--zx-accent); }
#zx-directions .zx-search input:focus-visible { outline-offset:1px; }
#zx-directions .zx-table { border-collapse:collapse; table-layout:fixed; width:100%; }
#zx-directions .zx-table th { text-align:left; padding:9px 10px; color:var(--zx-muted); font-size:11px; font-weight:400; border-bottom:1px solid var(--zx-line); }
#zx-directions .zx-table td { padding:13px 10px; border-bottom:1px solid var(--zx-line); vertical-align:middle; }
#zx-directions .zx-table tbody tr { background:transparent; }
#zx-directions .zx-table th:first-child, #zx-directions .zx-table td:first-child { padding-left:12px; }
#zx-directions .zx-table th:last-child, #zx-directions .zx-table td:last-child { padding-right:12px; }
#zx-directions .zx-table tr.zx-selected { background:var(--zx-selected); }
#zx-directions .zx-table tr.zx-selected td:first-child { box-shadow:inset 3px 0 var(--zx-accent); }
#zx-directions .zx-table tbody tr:hover { background:var(--zx-raised); }
#zx-directions .zx-table tbody tr.zx-selected:hover { background:var(--zx-selected); }
#zx-directions .zx-file-button { display:flex; width:100%; align-items:center; gap:10px; padding:3px 0; border:0; text-align:left; background:transparent; min-width:0; }
#zx-directions .zx-file-icon { color:var(--zx-muted); width:32px; height:35px; display:flex; align-items:center; justify-content:center; border:1px solid var(--zx-line); border-radius:6px; font:11px/1 Consolas,monospace; flex:none; }
#zx-directions .zx-file-copy { min-width:0; }
#zx-directions .zx-file-copy strong { display:block; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#zx-directions .zx-file-copy small { display:block; color:var(--zx-muted); font-size:11px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#zx-directions .zx-status { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--zx-muted); }
#zx-directions .zx-status::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; }
#zx-directions .zx-status.running { color:var(--zx-accent); }
#zx-directions .zx-status.completed { color:var(--zx-good); }
#zx-directions .zx-status.failed, #zx-directions .zx-status.canceled { color:var(--zx-error); }
#zx-directions .zx-status-note { display:block; margin-top:4px; font-size:11px; color:var(--zx-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#zx-directions .zx-progress { height:5px; background:var(--zx-line); border-radius:3px; overflow:hidden; margin-top:7px; }
#zx-directions .zx-progress-fill { height:100%; width:63%; background:var(--zx-accent); border-radius:inherit; transition:width .2s ease-out; }
#zx-directions .zx-row-progress { display:flex; align-items:center; gap:12px; justify-content:space-between; }
#zx-directions .zx-percentage { color:var(--zx-text); font-size:12px; }
#zx-directions .zx-actions { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
#zx-directions .zx-actions button { padding:5px 7px; font-size:11px; min-height:30px; color:var(--zx-accent); border:1px solid transparent; border-radius:6px; background:transparent; }
#zx-directions .zx-actions button:hover { background:var(--zx-raised); border-color:var(--zx-line); }
#zx-directions .zx-actions .zx-retry { color:var(--zx-error); }
#zx-directions .zx-actions button.zx-copied { color:var(--zx-good); background:var(--zx-raised); }
#zx-directions .zx-empty { text-align:center; padding:70px 10px; color:var(--zx-muted); }
#zx-directions .zx-batch-track { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; height:8px; margin:14px 0 9px; }
#zx-directions .zx-batch-track span { background:var(--zx-line); border-radius:3px; }
#zx-directions .zx-batch-track .done { background:var(--zx-good); }
#zx-directions .zx-batch-track .active { background:var(--zx-accent); opacity:.55; }
#zx-directions .zx-batch-track .error { background:var(--zx-error); }
#zx-directions .zx-batch-caption { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--zx-muted); font-size:11px; }
#zx-directions .zx-batch-caption b { color:var(--zx-text); font-weight:500; }
#zx-directions .zx-footer { padding:13px 22px; border-top:1px solid var(--zx-line); display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11px; color:var(--zx-muted); }
#zx-directions .zx-session { display:flex; align-items:center; gap:7px; }
#zx-directions .zx-session::before { content:''; width:5px; height:5px; background:var(--zx-accent); border-radius:50%; }

  {name:'素材包.7z.001',kind:'7Z',status:'queued',phase:'queued',note:'等待开始',source:'素材包 / 3 卷',progress:null},
  {name:'文档合集.rar',kind:'RAR',status:'failed',phase:'failed',note:'密码不匹配，请修改后重试',source:'文档合集 / 单文件',progress:null},
  {name:'设计资源.7z',kind:'7Z',status:'queued',phase:'queued',note:'等待开始',source:'设计资源 / 单文件',progress:null}
 ];
 const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=name=>`<i class="zx-icon" data-lucide="${name}" aria-hidden="true"></i>`;
 const button=(cmd,text,type='',more='')=>`<button type="button" class="zx-button cursor-interaction ${type}" data-cmd="${cmd}" ${more}>${text}</button>`;
 const modes=()=>`<div class="zx-mode" aria-label="解压模式"><button type="button" class="cursor-interaction" data-cmd="mode-file" aria-pressed="false">${icon('file-archive')} 文件解压</button><button type="button" class="cursor-interaction" data-cmd="mode-folder" aria-pressed="true">${icon('folder-open')} 文件夹解压</button></div>`;
 const actions=()=>`<div class="zx-controls main-actions">${button('choose',icon('folder-open')+' 选择文件夹','primary')}${button('pause',icon('pause')+' 暂停调度')}${button('cancel','取消','quiet')}</div>`;
 const path=()=>`<div class="zx-path">${icon('folder')}<span data-tooltip="D:\\资料\\待解压">D:\\资料\\待解压</span><span class="zx-mode-context">包含子文件夹</span></div>`;
 const params=theme=>`<div class="zx-params"><div class="zx-param"><span>密码</span>${button('password','自动推断','quiet',`aria-expanded="false" aria-controls="${theme}-password"`)}</div><div class="zx-param"><span>输出</span>${button('options','同名子文件夹','quiet',`aria-expanded="false" aria-controls="${theme}-options"`)}</div><div class="zx-param"><label><input type="checkbox" checked> 跨目录归并分卷</label></div><div class="zx-flex-spacer"></div>${button('scan','仅扫描','quiet')}${button('options','更多选项','quiet',`aria-expanded="false" aria-controls="${theme}-options"`)}</div>`;
 const panels=theme=>`<section class="zx-panel" id="${theme}-password" hidden aria-label="密码设置"><div class="zx-panel-header"><h3>候选密码</h3>${button('close-panel','关闭','quiet')}</div><label for="${theme}-password-input">每行一个，按顺序尝试；这里仅演示界面，不执行解压</label><textarea id="${theme}-password-input" placeholder="输入候选密码"></textarea><div class="zx-controls">${button('retry-confirm','应用并重试','primary')}${button('save-password','保存到密码库')}${button('manage-password','管理密码与规则','quiet')}</div></section><section class="zx-panel" id="${theme}-options" hidden aria-label="解压选项"><div class="zx-panel-header"><h3>解压选项</h3>${button('close-panel','关闭','quiet')}</div><div class="zx-options-grid"><div><label for="${theme}-output">输出位置</label><select id="${theme}-output"><option>同名子文件夹</option><option>所在目录</option><option>指定目录</option></select></div><div><label for="${theme}-conflict">遇到同名文件</label><select id="${theme}-conflict"><option>重命名已有文件</option><option>覆盖已有文件</option><option>跳过同名文件</option></select></div><div><label for="${theme}-parallel">并行任务数</label><input type="number" id="${theme}-parallel" value="4" min="1" max="32"></div><div><label><input type="checkbox" checked> 递归解压嵌套压缩包</label><label><input type="checkbox"> 成功后删除源压缩文件</label></div></div></section>`;
 const listbar=theme=>`<div class="zx-listbar"><div class="zx-filters" aria-label="任务筛选"></div><label class="zx-search">${icon('search')}<input type="search" aria-label="搜索文件名或路径" placeholder="搜索文件名或路径"></label></div>`;
 const table=theme=>`<table class="zx-table" aria-label="${theme==='grid'?'解压任务控制列表':'压缩文件任务列表'}"><colgroup><col style="width:${theme==='ink'?'44':theme==='paper'?'47':'46'}%"><col style="width:${theme==='ink'?'35':theme==='paper'?'30':'32'}%"><col></colgroup><thead><tr><th scope="col">${theme==='grid'?'来源文件 / 分卷':'文件'}</th><th scope="col">${theme==='grid'?'阶段 / 进度':'状态 / 进度'}</th><th scope="col">操作</th></tr></thead><tbody></tbody></table>`;
 const batch=()=>`<div class="zx-batch-track" role="img" aria-label="批次任务状态"></div><div class="zx-batch-caption"></div>`;
 const footer=()=>`<footer class="zx-footer"><div><div class="zx-session" aria-live="polite">正在解压 · 已完成 1 / 6 项</div><div class="zx-toast" role="status" aria-live="polite"></div></div><div class="zx-controls">${button('log','查看日志','quiet')}${button('export','导出','quiet')}</div></footer><div class="zx-log" hidden aria-label="运行日志（演示数据）"><h3>运行日志 <span class="zx-muted">· 演示事件</span></h3><p class="zx-mono">INFO　发现 6 个任务，归并分卷完成</p><p class="zx-mono">INFO　项目备份.zip / 正在解压 / 年度项目备份.txt</p><p class="zx-mono">WARN　文档合集.rar / 密码不匹配</p></div><dialog class="zx-dialog" aria-label="取消当前批次"><h3>取消当前批次？</h3><p>已完成的输出不会删除。未开始任务将停止，正在进行的任务会请求取消。此处只演示界面。</p><div class="zx-controls">${button('dismiss-cancel','返回')}${button('confirm-cancel','取消批次','primary')}</div></dialog>`;
 const top=theme=>`<header class="zx-top"><div class="zx-brand"><span class="zx-brand-mark">Z</span>Zxtract${theme==='grid'?'<span class="zx-kicker">/ ENGINE</span>':''}</div><span class="zx-preview-tag">界面概念 · 演示数据</span><div class="zx-chrome" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div></header>`;
 const pauseHint=()=>`<div class="zx-pause-hint" role="status">不再启动新任务；正在解压的任务会继续。</div>`;
 root.querySelectorAll('.zx-stage').forEach(stage=>{
  const theme=stage.dataset.theme;
  const state={rows:initial.map(x=>({...x})),selected:1,filter:'all',search:'',paused:false,canceled:false,mode:'folder',retry:4};
  let body;
if(theme==='ink') body=`<div class="zx-ink-shell"><main class="zx-ink-body"><div class="zx-ink-hero"><div><div class="zx-kicker">INK / FLOW</div><h2 class="zx-workflow-title">文件夹解压</h2>${path()}</div>${actions()}</div>${modes()}${params(theme)}${panels(theme)}${pauseHint()}<div class="zx-ink-main"><div>${listbar(theme)}${table(theme)}<div class="zx-batch"><div class="zx-detail-label">本批次 · 6 个任务</div>${batch()}</div></div><aside class="zx-inspector" aria-label="当前任务详情"></aside></div></main></div>`;
  if(theme==='paper') body=`<div class="zx-paper-shell"><nav class="zx-paper-nav" aria-label="工作台导航"><div class="zx-kicker">PAPER / STUDIO</div>${modes()}<div class="zx-nav-rule"></div><div class="zx-nav-summary"></div><div class="zx-nav-bottom">Ctrl + O 添加文件<br>F5 开始解压</div></nav><main class="zx-paper-body"><div class="zx-paper-hero"><div><div class="zx-kicker">WORKSPACE</div><h2 class="zx-workflow-title">文件夹工作台</h2>${path()}</div><div class="zx-batch"><div class="zx-detail-label">本批次已完成</div><div class="zx-batch-number">1 <small>/ 6 项</small></div>${batch()}</div></div>${actions()}${params(theme)}${panels(theme)}${pauseHint()}${listbar(theme)}${table(theme)}<div class="zx-paper-detail zx-inspector" aria-label="当前任务详情"></div></main></div>`;
  if(theme==='grid') body=`<main class="zx-grid-body">${modes()}<div class="zx-grid-header"><div><div class="zx-grid-title"><h2 class="zx-workflow-title">解压控制台</h2><span class="zx-kicker">GRID / ENGINE</span></div>${path()}</div>${actions()}</div><section class="zx-overview" aria-label="批次任务状态"><div><div class="zx-detail-label">批次完成</div><div class="zx-overview-value">1 <small>/ 6 TASKS</small></div></div><div><div class="zx-kicker">BATCH / TASK STATE</div>${batch()}</div><div class="zx-run-info"><span>密码来源 <b>路径推断</b></span><span>输出 <b>同名子目录</b></span><span>并行上限 <b class="zx-mono">04</b></span></div></section>${params(theme)}${panels(theme)}${pauseHint()}${listbar(theme)}${table(theme)}<section class="zx-grid-dock" aria-label="任务检查与日志"><div class="zx-inspector" aria-label="当前任务详情"></div><div class="zx-log-inline"><div class="zx-kicker">EVENT LOG / 演示事件</div><p class="zx-mono"><strong>INFO</strong>　分卷整理完成，发现 6 项</p><p class="zx-mono"><strong>INFO</strong>　项目备份.zip → 解压中</p><p class="zx-mono">WARN　文档合集.rar → 密码不匹配</p></div></section></main>`;
  stage.innerHTML=`<article class="zx-window zx-${theme}" aria-label="${theme==='ink'?'墨流':theme==='paper'?'纸境':'栅格'}界面设计稿">${top(theme)}${body}${footer()}</article>`;
  const win=stage.querySelector('.zx-window');
  const notify=text=>{win.querySelector('.zx-toast').textContent=text;};
  const counts=()=>({all:state.rows.length,running:state.rows.filter(r=>r.status==='running').length,attention:state.rows.filter(r=>['failed','canceled'].includes(r.status)).length,completed:state.rows.filter(r=>r.status==='completed').length});
  const labels={running:'正在解压',completed:'已完成',queued:'等待开始',failed:'解压失败',canceled:'已取消'};
  const rowMarkup=(row,id)=>{
   const progress=row.phase==='extract'&&row.status==='running';
   const text=row.phase==='password'?'验证密码':labels[row.status];
   const action=row.status==='failed'?'<button type="button" class="zx-retry cursor-interaction" data-cmd="retry" data-id="'+id+'">修改密码</button>':row.status==='completed'?'<button type="button" class="cursor-interaction" data-cmd="open" data-id="'+id+'">打开位置</button>':'';
   return `<tr class="${id===state.selected?'zx-selected':''}" data-row="${id}"><td><button type="button" class="zx-file-button cursor-interaction" data-cmd="select" data-id="${id}" aria-pressed="${id===state.selected}"><span class="zx-file-icon" aria-hidden="true">${row.kind}</span><span class="zx-file-copy"><strong>${esc(row.name)}</strong><small data-tooltip="${esc(row.source)}">${esc(row.source)}</small></span></button></td><td><div class="zx-row-progress"><span class="zx-status ${row.status}">${text}</span>${progress?`<span class="zx-percentage zx-mono">${row.progress}%</span>`:''}</div>${progress?`<div class="zx-progress" role="progressbar" aria-label="${esc(row.name)}解压进度" aria-valuenow="${row.progress}" aria-valuemin="0" aria-valuemax="100"><div class="zx-progress-fill" style="width:${row.progress}%"></div></div>`:''}<span class="zx-status-note">${row.phase==='password'?'正在验证候选密码':row.note===labels[row.status]?'':esc(row.note)}</span></td><td><div class="zx-actions">${action}<button type="button" class="cursor-interaction" data-cmd="copy" data-id="${id}">复制路径</button></div></td></tr>`;
  };
  function detail(){
   const row=state.rows[state.selected];
   const current=win.querySelector('.zx-inspector');
   if(!row){current.innerHTML='<div class="zx-muted">没有选中任务</div>';return;}
   const progress=row.phase==='extract'&&row.status==='running';
   const number=progress?`${row.progress}<small>%</small>`:row.status==='completed'?'<span style="font-size:32px;letter-spacing:0">已完成</span>':'<span style="font-size:24px;letter-spacing:0">'+(row.phase==='password'?'验证密码':labels[row.status])+'</span>';
   const name=`<div><div class="zx-kicker">${theme==='paper'?'当前选中':'FOCUS / 当前任务'}</div><h3>${esc(row.name)}</h3>${theme==='paper'?`<div class="zx-detail-path">D:\\资料\\待解压\\${esc(row.name)}</div>`:''}</div>`;
   const fields=`<div class="zx-detail-fields"><div><div class="zx-detail-label">${progress?'正在处理':row.phase==='password'?'当前状态':'任务状态'}</div><strong>${esc(row.note)}</strong></div><div><div class="zx-detail-label">输出目录</div><strong class="zx-detail-path">D:\\资料\\解压结果\\${esc(row.name.split('.')[0])}</strong></div></div>`;
   const progressDetail=progress?`<div class="zx-progress" role="progressbar" aria-label="选中任务解压进度" aria-valuenow="${row.progress}" aria-valuemin="0" aria-valuemax="100"><div class="zx-progress-fill" style="width:${row.progress}%"></div></div><div class="zx-progress-scale zx-mono"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>`:'';
   if(theme==='ink') current.innerHTML=name+`<div class="zx-big-number">${number}</div>`+progressDetail+`<div class="zx-detail-phase"><span class="${row.phase==='password'?'current':''}">验证密码</span><span class="${row.phase==='extract'?'current':''}">解压文件</span><span>写入目录</span></div>`+fields+button('copy',icon('copy')+' 复制来源路径','',`data-id="${state.selected}"`);
   if(theme==='paper') current.innerHTML=name+button('copy',icon('copy')+' 复制来源路径','quiet',`data-id="${state.selected}"`);
   if(theme==='grid') current.innerHTML=`<div>${name}${fields}</div><div class="zx-controls">${button('copy',icon('copy'),'quiet',`data-id="${state.selected}" aria-label="复制当前任务来源路径"`)}</div>`;
   if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  }
  function render(){
   const c=counts();
   win.querySelector('.zx-filters').innerHTML=[['all','全部'],['running','处理中'],['attention','需处理'],['completed','已完成']].map(([key,label])=>`<button type="button" class="zx-filter cursor-interaction" data-cmd="filter" data-filter="${key}" aria-pressed="${key===state.filter}">${label}<b>${c[key]}</b></button>`).join('');
   const rows=state.rows.map((r,id)=>({r,id})).filter(({r})=>(state.filter==='all'||state.filter==='attention'&&['failed','canceled'].includes(r.status)||state.filter===r.status)&&('D:\\资料\\待解压\\'+r.name+r.source).toLowerCase().includes(state.search));
   if(!rows.some(({id})=>id===state.selected))state.selected=rows.length?rows[0].id:null;
   win.querySelector('tbody').innerHTML=rows.map(({r,id})=>rowMarkup(r,id)).join('')||`<tr><td colspan="3" class="zx-empty">${state.search?'没有匹配的文件':'此分类下暂无任务'}</td></tr>`;
   const total=state.rows.length;
   win.querySelector('.zx-batch-track').innerHTML=state.rows.map(r=>`<span class="${r.status==='completed'?'done':r.status==='running'?'active':['failed','canceled'].includes(r.status)?'error':''}"></span>`).join('');
   win.querySelector('.zx-batch-track').setAttribute('aria-label',`${total}项：完成${c.completed}，处理中${c.running}，需处理${c.attention}，等待${total-c.completed-c.running-c.attention}`);
win.querySelector('.zx-batch-caption').innerHTML=`<span>完成 <b>${c.completed}</b></span><span>处理中 <b>${c.running}</b></span><span>需处理 <b>${c.attention}</b></span><span>等待 <b>${total-c.completed-c.running-c.attention}</b></span>`;
   win.querySelector('.zx-session').textContent=`${state.canceled?'批次已取消':state.paused?'已暂停调度':'正在解压'} · 已完成 ${c.completed} / ${total} 项`;
   win.classList.toggle('zx-paused',state.paused&&!state.canceled);
   const pause=win.querySelector('[data-cmd=pause]'); pause.innerHTML=icon(state.paused?'play':'pause')+(state.paused?' 继续调度':' 暂停调度');pause.disabled=state.canceled;win.querySelector('[data-cmd=cancel]').disabled=state.canceled;
   if(theme==='paper'){win.querySelector('.zx-batch-number').innerHTML=`${c.completed} <small>/ ${total} 项</small>`;win.querySelector('.zx-nav-summary').innerHTML=`<p>本批次 <b>${total}</b></p><p>处理中 <b>${c.running}</b></p><p>需处理 <b>${c.attention}</b></p><p>已完成 <b>${c.completed}</b></p>`;}
   if(theme==='grid') win.querySelector('.zx-overview-value').innerHTML=`${c.completed} <small>/ ${total} TASKS</small>`;
   detail();
  }
  function panel(kind,trigger){
   const target=win.querySelector('#'+theme+'-'+kind),open=target.hidden;
   win.querySelectorAll('.zx-panel').forEach(el=>el.hidden=true);
   win.querySelectorAll('[aria-expanded]').forEach(el=>el.setAttribute('aria-expanded','false'));
   target.hidden=!open;
   if(open&&trigger)state.panelOpener=trigger;
   if(open){win.querySelectorAll(`[data-cmd="${kind}"][aria-expanded]`).forEach(el=>el.setAttribute('aria-expanded','true'));if(kind==='password')target.querySelector('textarea').focus();}
   else if(trigger)trigger.focus();
  }
  win.addEventListener('input',event=>{if(event.target.matches('.zx-search input')){state.search=event.target.value.toLowerCase();render();}});
  win.addEventListener('click',event=>{
   const target=event.target.closest('button[data-cmd]');if(!target||target.disabled)return;
   const cmd=target.dataset.cmd,id=Number(target.dataset.id);
   if(cmd==='select'){state.selected=id;render();const selected=win.querySelector(`[data-cmd=select][data-id="${id}"]`);if(selected)selected.focus({preventScroll:true});}
   if(cmd==='filter'){state.filter=target.dataset.filter;render();win.querySelector(`[data-filter="${state.filter}"]`).focus({preventScroll:true});}
   if(cmd==='pause'){state.paused=!state.paused;render();}
   if(cmd==='copy'){const original=target.dataset.copyOriginal||target.innerHTML;target.dataset.copyOriginal=original;const version=Number(target.dataset.copyVersion||0)+1;target.dataset.copyVersion=String(version);target.textContent='已复制 ✓';target.classList.add('zx-copied');notify('演示：路径已复制，不会写入系统剪贴板。');setTimeout(()=>{if(target.isConnected&&target.dataset.copyVersion===String(version)){target.innerHTML=original;target.classList.remove('zx-copied');}},1800);}
   if(cmd==='password'||cmd==='options')panel(cmd,target);
   if(cmd==='close-panel'){win.querySelectorAll('.zx-panel').forEach(el=>el.hidden=true);win.querySelectorAll('[aria-expanded]').forEach(el=>el.setAttribute('aria-expanded','false'));if(state.panelOpener&&state.panelOpener.isConnected)state.panelOpener.focus();else win.querySelector('[data-cmd=password]').focus();}
   if(cmd==='retry'){state.retry=id;const pw=win.querySelector('#'+theme+'-password');if(pw.hidden)panel('password',target);else pw.querySelector('textarea').focus();notify('为“'+state.rows[id].name+'”设置候选密码。');}
   if(cmd==='retry-confirm'){const textarea=win.querySelector('textarea');if(!textarea.value.trim()){notify('请先输入候选密码。');textarea.focus();}else{state.rows[state.retry].status='queued';state.rows[state.retry].phase='queued';state.rows[state.retry].note='候选密码已设置，等待重试';render();win.querySelectorAll('.zx-panel').forEach(el=>el.hidden=true);win.querySelectorAll('[aria-expanded]').forEach(el=>el.setAttribute('aria-expanded','false'));win.querySelector('.zx-filter[aria-pressed=true]').focus({preventScroll:true});notify('演示：任务返回等待队列；未执行解压。');}}
   if(cmd==='cancel')win.querySelector('dialog').showModal();
   if(cmd==='dismiss-cancel')win.querySelector('dialog').close();
   if(cmd==='confirm-cancel'){state.canceled=true;state.rows.forEach(r=>{if(['queued','running'].includes(r.status)){r.status='canceled';r.phase='canceled';r.note='用户取消';}});win.querySelector('dialog').close();render();notify('演示：已取消此批次；文件未被修改。');}
   if(cmd==='log'){const log=win.querySelector('.zx-log');log.hidden=!log.hidden;target.textContent=log.hidden?'查看日志':'收起日志';}
   if(cmd.startsWith('mode-')){state.mode=cmd==='mode-file'?'file':'folder';win.querySelectorAll('.zx-mode button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cmd===cmd)));win.querySelectorAll('.zx-rail-item').forEach(b=>b.classList.toggle('active',b.dataset.cmd===cmd));win.querySelector('.zx-workflow-title').textContent=theme==='grid'?'解压控制台':state.mode==='folder'?(theme==='paper'?'文件夹工作台':'文件夹解压'):'文件解压';win.querySelector('.zx-mode-context').textContent=state.mode==='folder'?'包含子文件夹':'已添加 6 个文件';win.querySelector('[data-cmd=choose]').innerHTML=icon(state.mode==='folder'?'folder-open':'file-plus')+(state.mode==='folder'?' 选择文件夹':' 添加文件');if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
   if(['choose','scan','open','export','save-password','manage-password'].includes(cmd))notify('设计演示：'+({choose:'选择来源',scan:'仅扫描文件夹',open:'打开输出目录',export:'导出运行日志','save-password':'保存候选密码','manage-password':'管理密码与规则'}[cmd])+'；不会操作本机文件。');
  });
  render();
  if(globalThis.Tweak){
   const controls={progress:63,accent:theme==='ink'?'#91ecda':theme==='paper'?'#285f50':'#c7ea7f'};
   const tweak=new Tweak({container:win,onChange:()=>{state.rows[1].progress=controls.progress;win.style.setProperty('--zx-accent',controls.accent);render();}});
   tweak.addSlider(controls,'progress',{label:'演示单项进度',min:0,max:100,step:1,unit:'%',reference:'progress'});
   tweak.addColorPicker(controls,'accent',{label:'强调色探索',reference:'--zx-accent'});
  }
 });
})();
</script>
